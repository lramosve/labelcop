name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # The build never calls the LLM, but the verifier module is imported
          # and reads env vars at module load time. Providing dummy values keeps
          # any future eager validation happy.
          LLM_PROVIDER: openai
          OPENAI_API_KEY: dummy-key-for-build-only
